version: 2

models:
  - name: dim_customers
    description: Customer dimension table with lifetime order statistics and segments.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null
      - name: customer_name
        description: Customer full name.
      - name: country
        description: Customer country.
      - name: total_orders
        description: Lifetime order count.
      - name: first_order_date
        description: First order date.
      - name: last_order_date
        description: Most recent order date.
      - name: lifetime_value
        description: Sum of all final_amount values.
      - name: avg_order_value
        description: Average final_amount.
      - name: customer_segm