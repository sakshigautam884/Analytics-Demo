# ============================================================
# profiles.yml  –  place this at ~/.dbt/profiles.yml
# or set DBT_PROFILES_DIR to point to this file's directory
# ============================================================

analytics_poc:
  target: dev
  outputs:

    # ── Development ─────────────────────────────────────────
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"        # e.g. xy12345.us-east-1
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: DEV_ENGINEER_FR                                 # your dev role
      database: DBT_PROJECT                                 # target database
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: DBT_SGAUTAM                                   # personal dev schema
      threads: 4
      client_session_keep_alive: false
      query_tag: dbt_dev

    # ── Production ──────────────────────────────────────────
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_PROD_ROLE', 'TRANSFORMER') }}"
      database: DBT_POC
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: PUBLIC
      threads: 8
      client_session_keep_alive: false
      query_tag: dbt_prod
